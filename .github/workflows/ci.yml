name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -r basestation/requirements.txt
      - run: python -m pytest
      - name: Firmware-decoder tegen backend-frames
        run: firmware/label/test/run.sh
      - name: Demo
        run: python scripts/demo.py
